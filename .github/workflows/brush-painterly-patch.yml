name: Painterly brush patch

on:
  push:
    paths:
      - '.github/workflows/brush-painterly-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch brush engine
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('function brush(c,s){')
          end=s.index('function marker(c,s){', start)
          new='''function brushRand(seed,x,y,k=0){let h=(seed||2166136261)>>>0;h^=(x*73856093|0);h=Math.imul(h,16777619);h^=(y*19349663|0);h=Math.imul(h,16777619);h^=k*83492791;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}function brushRgba(hex,a){const h=hex.replace('#',''),v=h.length===3?h.split('').map(x=>x+x).join(''):h,n=parseInt(v,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}function paintStamp(c,x,y,w,h,a,s,key){const seed=s.seed||1,water=s.wateriness??.28,edge=s.edgeDarken??.1,rr=Math.max(w,h)*.58;c.save();c.translate(x,y);c.rotate(a);const g=c.createRadialGradient(0,0,Math.max(0.1,rr*.08),0,0,rr);g.addColorStop(0,brushRgba(s.color,(s.opacity??1)*(.68+brushRand(seed,x|0,y|0,key)*.16)));g.addColorStop(.55,brushRgba(s.color,(s.opacity??1)*(.48+water*.22)));g.addColorStop(.88,brushRgba(s.color,(s.opacity??1)*(.18+water*.16)));g.addColorStop(1,brushRgba(s.color,0));c.fillStyle=g;c.beginPath();s.shape==='flat'?c.roundRect(-w/2,-h/2,w,h,Math.min(h/2,4)):c.ellipse(0,0,w/2,h/2,0,0,7);c.fill();if(edge>0){c.strokeStyle=brushRgba(s.color,(s.opacity??1)*edge*(.55+brushRand(seed,x|0,y|0,key+1)*.45));c.lineWidth=Math.max(.5,Math.min(w,h)*.045);c.beginPath();s.shape==='flat'?c.roundRect(-w/2,-h/2,w,h,Math.min(h/2,4)):c.ellipse(0,0,w/2,h/2,0,0,7);c.stroke()}c.restore()}function paintSplash(c,x,y,size,s,key){const seed=s.seed||1,count=2+Math.floor(brushRand(seed,x|0,y|0,key)*4);c.save();for(let i=0;i<count;i++){const r1=brushRand(seed,x|0,y|0,key+i*7+2),r2=brushRand(seed,x|0,y|0,key+i*7+3),r3=brushRand(seed,x|0,y|0,key+i*7+4),ang=r1*6.283185307,dist=size*(.35+r2*.85),rad=Math.max(.45,size*(.018+r3*.045));c.fillStyle=brushRgba(s.color,(s.opacity??1)*(.08+r3*.13));c.beginPath();c.arc(x+Math.cos(ang)*dist,y+Math.sin(ang)*dist,rad,0,7);c.fill()}c.restore()}function paintDrip(c,x,y,size,s,key){const seed=s.seed||1,r1=brushRand(seed,x|0,y|0,key+1),r2=brushRand(seed,x|0,y|0,key+2),len=size*(.22+r1*.58),dx=(r2-.5)*size*.12;c.save();c.strokeStyle=brushRgba(s.color,(s.opacity??1)*(.08+r1*.08));c.lineWidth=Math.max(.65,size*(.018+r2*.022));c.lineCap='round';c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+dx*.35,y+len*.45,x+dx,y+len);c.stroke();c.fillStyle=brushRgba(s.color,(s.opacity??1)*(.1+r2*.08));c.beginPath();c.arc(x+dx,y+len,c.lineWidth*1.15,0,7);c.fill();c.restore()}function brush(c,s){if(!s.points?.length)return;c.save();const water=s.wateriness??.28,texture=s.texture??.16,splatter=s.splatter??.03,drip=s.drip??.015;for(let i=0;i<s.points.length;i++){const p=s.points[i],q=s.points[Math.max(0,i-1)],d=Math.max(1,Math.hypot(p.x-q.x,p.y-q.y)),n=Math.max(1,Math.ceil(d/Math.max(1,(s.width||18)*.14)));for(let j=0;j<n;j++){const t=n===1?1:j/n,pr=(q.pressure??.5)+((p.pressure??.5)-(q.pressure??.5))*t,w=(s.width||18)*(s.pressure===false?1:.28+Math.pow(pr,.72)*1.55),x=q.x+(p.x-q.x)*t,y=q.y+(p.y-q.y)*t,a=(s.follow?Math.atan2(p.y-q.y,p.x-q.x):0)+(s.angle||0)*Math.PI/180,key=((x*7+y*11)|0);paintStamp(c,x,y,w,w*(s.aspect??1),a,s,key);const extra=water>.3?2:1;for(let z=0;z<extra;z++){const ox=(brushRand(s.seed,x|0,y|0,key+20+z)-.5)*w*.22,oy=(brushRand(s.seed,x|0,y|0,key+30+z)-.5)*w*.22,scale=.82+brushRand(s.seed,x|0,y|0,key+40+z)*.26;c.save();c.globalAlpha=.15+water*.16;paintStamp(c,x+ox,y+oy,w*scale,w*(s.aspect??1)*scale,a+(brushRand(s.seed,x|0,y|0,key+50+z)-.5)*.12,{...s,edgeDarken:0,opacity:(s.opacity??1)*.36},key+60+z);c.restore()}if(texture>0&&brushRand(s.seed,x|0,y|0,key+70)<texture*.38){c.save();c.fillStyle=brushRgba(s.color,(s.opacity??1)*(.025+texture*.06));const dots=2+Math.floor(brushRand(s.seed,x|0,y|0,key+71)*4);for(let m=0;m<dots;m++){const rx=(brushRand(s.seed,x|0,y|0,key+80+m*3)-.5)*w*.7,ry=(brushRand(s.seed,x|0,y|0,key+81+m*3)-.5)*w*(s.aspect??1)*.7,rr=.35+brushRand(s.seed,x|0,y|0,key+82+m*3)*Math.max(.6,w*.045);c.beginPath();c.arc(x+rx,y+ry,rr,0,7);c.fill()}c.restore()}const speed=Math.min(1.4,d/Math.max(1,w*.5));if(brushRand(s.seed,x|0,y|0,key+100)<splatter*(.35+speed*.6))paintSplash(c,x,y,w,s,key+110);if(brushRand(s.seed,x|0,y|0,key+120)<drip*Math.max(.15,1-speed*.55)*(.55+pr*.45))paintDrip(c,x,y+w*(s.aspect??1)*.16,w,s,key+130)}}c.restore()}'''
          s=s[:start]+new+s[end:]
          old="if(activeTool==='brush'){const v={round:['oval',1],oval:['oval',.55],flat:['flat',.28]}[brushPreset];return{id,kind:'stroke',tool:'brush',color,width:brushSize,opacity:brushOpacity,pressure:pressureEnabled,angle:brushAngle,shape:v[0],aspect:v[1],follow:brushPreset==='oval',points:[p]}}"
          repl="if(activeTool==='brush'){const v={round:{shape:'oval',aspect:1,follow:false,wateriness:.34,texture:.18,splatter:.035,drip:.012,edgeDarken:.11},oval:{shape:'oval',aspect:.55,follow:true,wateriness:.4,texture:.23,splatter:.045,drip:.018,edgeDarken:.12},flat:{shape:'flat',aspect:.28,follow:false,wateriness:.24,texture:.15,splatter:.025,drip:.01,edgeDarken:.08}}[brushPreset];let seed=0;for(const ch of id)seed=Math.imul(seed^ch.charCodeAt(0),16777619)>>>0;return{id,kind:'stroke',tool:'brush',color,width:brushSize,opacity:brushOpacity,pressure:pressureEnabled,angle:brushAngle,shape:v.shape,aspect:v.aspect,follow:v.follow,wateriness:v.wateriness,texture:v.texture,splatter:v.splatter,drip:v.drip,edgeDarken:v.edgeDarken,seed,points:[p]}}"
          if old not in s: raise SystemExit('brush preset block not found')
          s=s.replace(old,repl,1)
          p.write_text(s)
          PY
      - name: Check module syntax
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/app.mjs').write_text(s[a:b])
          PY
          node --check /tmp/app.mjs
      - name: Commit patch
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make brushes painterly with watercolor texture" || exit 0
          git push
