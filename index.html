function renderOptions(){const el=$('#toolOptions'),tog=`<button id="pressureToggle" class="toggle ${pressureEnabled?'on':''}"></button>`;if(activeTool==='pencil')el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Карандаш</span><input id="pencilSize" class="range" type="range" min="1" max="18" value="${pencilSize}"><span class="rangeValue">${pencilSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span>${tog}</div>`;else if(activeTool==='brush')el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Кисть</span><div class="seg">${[['round','Круглая'],['oval','Овальная'],['flat','Плоская']].map(([v,n])=>`<button data-preset="${v}" class="${brushPreset===v?'active':''}">${n}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="brushSize" class="range" type="range" min="3" max="80" value="${brushSize}"><span class="rangeValue">${brushSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Угол</span><input id="brushAngle" class="range" type="range" min="0" max="180" value="${brushAngle}"><span class="rangeValue">${brushAngle}°</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span>${tog}</div>`;else if(activeTool==='marker')el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Маркер</span><div class="seg">${[['narrow','Узкий'],['wide','Широкий'],['chisel','Скошенный'],['highlighter','Выделитель']].map(([v,n])=>`<button data-preset="${v}" class="${markerPreset===v?'active':''}">${n}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Ширина</span><input id="markerSize" class="range" type="range" min="4" max="64" value="${markerSize}"><span class="rangeValue">${markerSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Прозр.</span><input id="markerOpacity" class="range" type="range" min="10" max="100" value="${Math.round(markerOpacity*100)}"><span class="rangeValue">${Math.round(markerOpacity*100)}%</span></div><div class="optionsRow"><span class="optionsLabel">Угол</span><input id="markerAngle" class="range" type="range" min="0" max="180" value="${markerAngle}"><span class="rangeValue">${markerAngle}°</span></div>`;else if(activeTool==='pen')el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Перо</span><div class="seg">${[['fine','Тонкое'],['medium','Среднее'],['broad','Широкое'],['flat','Плоское'],['pointed','С точкой'],['decorative','Фигурное'],['calligraphy','Каллиграфия'],['poster','Плакатное']].map(([v,n])=>`<button data-preset="${v}" class="${penPreset===v?'active':''}">${n}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="penSize" class="range" type="range" min="2" max="48" value="${penSize}"><span class="rangeValue">${penSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Контраст</span><input id="penContrast" class="range" type="range" min="0" max="100" value="${Math.round(penContrast*100)}"><span class="rangeValue">${Math.round(penContrast*100)}%</span></div><div class="optionsRow"><span class="optionsLabel">Угол</span><input id="penAngle" class="range" type="range" min="0" max="180" value="${penAngle}"><span class="rangeValue">${penAngle}°</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span>${tog}</div>`;else if(activeTool==='eraser')el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Ластик</span><div class="seg"><button data-erasermode="hard" class="${eraserMode==='hard'?'active':''}">Полный</button><button data-erasermode="kneaded" class="${eraserMode==='kneaded'?'active':''}">Клячка</button></div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="eraserSize" class="range" type="range" min="6" max="180" value="${eraserSize}"><span class="rangeValue">${eraserSize}px</span></div>${eraserMode==='kneaded'?`<div class="optionsRow"><span class="optionsLabel">Сила</span><input id="kneadedStrength" class="range" type="range" min="5" max="55" value="${Math.round(kneadedStrength*100)}"><span class="rangeValue">${Math.round(kneadedStrength*100)}%</span></div>`:''}`;else if(activeTool==='smudge')el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Растушёвка</span><div class="seg">${[['finger','Палец'],['paper','Бумага'],['cloth','Тряпка'],['stump','Растушёвка']].map(([v,n])=>`<button data-smudgemode="${v}" class="${smudgeMode===v?'active':''}">${n}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="smudgeSize" class="range" type="range" min="8" max="180" value="${smudgeSize}"><span class="rangeValue">${smudgeSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Сила</span><input id="smudgeStrength" class="range" type="range" min="5" max="90" value="${Math.round(smudgeStrength*100)}"><span class="rangeValue">${Math.round(smudgeStrength*100)}%</span></div>`;else if(activeTool==='fill')el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Заливка</span><span>Нажмите внутри замкнутой области</span></div>`;else el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Эмоджи</span><div class="emojiGrid">${['😀','😂','😍','😎','🤩','🥳','❤️','🔥','⭐','✨','👍','👏','🎨','🚀','🌈','🌸'].map(x=>`<button data-emoji="${x}" class="${emoji===x?'active':''}">${x}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="emojiSize" class="range" type="range" min="36" max="240" value="${emojiSize}"><span class="rangeValue">${emojiSize}px</span></div>`;const x=document.createElement('button');x.className='optionsClose';x.innerHTML='<i data-lucide="x"></i>';x.onclick=closeOptions;el.prepend(x);lucide.createIcons();const bind=(id,set,s='px')=>$(id)?.addEventListener('input',e=>{set(+e.target.value);e.target.nextElementSibling.textContent=e.target.value+s;showToolPreview()});bind('#pencilSize',v=>pencilSize=v);bind('#brushSize',v=>brushSize=v);bind('#brushAngle',v=>brushAngle=v,'°');bind('#markerSize',v=>markerSize=v);bind('#markerOpacity',v=>markerOpacity=v/100,'%');bind('#markerAngle',v=>markerAngle=v,'°');bind('#penSize',v=>penSize=v);bind('#penContrast',v=>penContrast=v/100,'%');bind('#penAngle',v=>penAngle=v,'°');bind('#eraserSize',v=>eraserSize=v);bind('#kneadedStrength',v=>kneadedStrength=v/100,'%');bind('#smudgeSize',v=>smudgeSize=v);bind('#smudgeStrength',v=>smudgeStrength=v/100,'%');bind('#emojiSize',v=>emojiSize=v);$('#pressureToggle')?.addEventListener('click',()=>{pressureEnabled=!pressureEnabled;renderOptions();showToolPreview()});$$('[data-preset]').forEach(b=>b.onclick=()=>{if(activeTool==='brush')brushPreset=b.dataset.preset;if(activeTool==='marker'){markerPreset=b.dataset.preset;if(markerPreset==='highlighter')markerOpacity=.25}if(activeTool==='pen')penPreset=b.dataset.preset;renderOptions();showToolPreview()});$$('[data-erasermode]').forEach(b=>b.onclick=()=>{eraserMode=b.dataset.erasermode;renderOptions();showToolPreview()});$$('[data-smudgemode]').forEach(b=>b.onclick=()=>{smudgeMode=b.dataset.smudgemode;const defaults={finger:[42,.48],paper:[52,.28],cloth:[70,.34],stump:[28,.5]}[smudgeMode];smudgeSize=defaults[0];smudgeStrength=defaults[1];renderOptions();showToolPreview()});$$('[data-emoji]').forEach(b=>b.onclick=()=>{emoji=b.dataset.emoji;renderOptions();showToolPreview()})}
$('#customColorBtn').onclick=()=>$('#colorPopover').classList.toggle('hidden');$('#closeColor').onclick=()=>$('#colorPopover').classList.add('hidden');function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))),q=n=>Math.round(255*f(n)).toString(16).padStart(2,'0');return'#'+q(0)+q(8)+q(4)}function wheelPick(e){const r=$('#colorWheel').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,a=Math.atan2(dy,dx),d=Math.min(r.width/2,Math.hypot(dx,dy));hue=(a*180/Math.PI+360)%360;sat=Math.max(18,d/(r.width/2)*100);const m=$('#wheelMarker');m.style.left=50+Math.cos(a)*(sat/100)*50+'%';m.style.top=50+Math.sin(a)*(sat/100)*50+'%';setColor(hsl(hue,sat,light))}$('#colorWheel').onpointerdown=e=>wheelPick(e);$('#colorWheel').onpointermove=e=>{if(e.buttons)wheelPick(e)};$('#lightness').oninput=e=>{light=+e.target.value;setColor(hsl(hue,sat,light))};
function count(){const n=peerIds.size+1;$('#peerCount').textContent=n+' '+(n===1?'участник':n<5?'участника':'участников')}function openApp(){$('#setup').classList.add('hidden');$('#app').classList.remove('hidden');$('#codeBadge').textContent=code;$('#roleBadge').textContent=role==='host'?'ведущий':'участник';$('#myUserDot').style.background=MYCOLOR;$('#myUserLabel').textContent=role==='host'?'Вы · ведущий':'Вы · участник';$('#clearBtn').classList.toggle('hidden',role!=='host');count();setColor(color)}async function openShare(){const u=invite();$('#shareCode').textContent=code;$('#shareUrl').textContent=u;$('#shareModal').classList.remove('hidden');try{await QRCode.toCanvas($('#qrCanvas'),u,{width:186,margin:0})}catch{}}function closeShare(){$('#shareModal').classList.add('hidden')}$('#shareBtn').onclick=openShare;$('#closeShareBtn').onclick=closeShare;$('#copyLinkBtn').onclick=async()=>{await navigator.clipboard.writeText(invite());toast('Ссылка скопирована')};$('#nativeShareBtn').onclick=()=>navigator.share?navigator.share({title:'Glued Canvas',url:invite()}):$('#copyLinkBtn').click();
async function connect(c,r,restore=true){code=c;role=r;sessionStorage.setItem(ACTIVE,JSON.stringify({code,role}));if(restore)await loadState();else{items=[];redo=[];revision=0;updatedAt=Date.now()}room=joinRoom({appId:APP},'room-'+code);draw=room.makeAction('draw');state=room.makeAction('state');cursors=room.makeAction('cursor');commands=room.makeAction('command');draw.onMessage=d=>{if(d.type==='start'&&!index.has(d.stroke.id)){items.push(cloneItem(d.stroke));index.set(d.stroke.id,items.length-1)}if(d.type==='points'){const i=index.get(d.id);if(i!==undefined)items[i].points.push(...d.points.map(x=>({...x})))}if(d.type==='end')touch();render()};state.onMessage=(d,{peerId})=>{if(d.type==='snapshot')applySnapshot(d);if(d.type==='request')state.send(snapshot(),{target:peerId})};cursors.onMessage=(d,{peerId})=>{remoteCursors.set(peerId,{...d,updated:Date.now()});render()};commands.onMessage=d=>{if(d.type==='clear'&&d.actorRole!=='host')return;cmd(d)};room.onPeerJoin=id=>{peerIds.add(id);count();closeShare();state.send(snapshot(),{target:id});state.send({type:'request'},{target:id})};room.onPeerLeave=id=>{peerIds.delete(id);remoteCursors.delete(id);count();render()};openApp();resize();state.send({type:'request'})}
$('#createBtn').onclick=async()=>{code=String(Math.floor(1000+Math.random()*9000));$('#roomCode').textContent=code;status('#hostStatus','Комната '+code+' создана',1);await connect(code,'host',false);setTimeout(openShare,200)};$('#joinBtn').onclick=()=>{const c=$('#joinCode').value.trim();if(/^\d{4}$/.test(c))connect(c,'guest')};const auto=new URL(location.href).searchParams.get('join');if(/^\d{4}$/.test(auto||'')){setMode('join');$('#joinCode').value=auto;connect(auto,'guest')}else{try{const a=JSON.parse(sessionStorage.getItem(ACTIVE)||'null');if(a?.code)connect(a.code,a.role||'guest')}catch{}}
