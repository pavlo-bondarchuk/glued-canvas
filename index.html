function count(){const n=peerIds.size+1;$('#peerCount').textContent=n+' '+(n===1?'участник':n<5?'участника':'участников')}function openApp(){$('#setup').classList.add('hidden');$('#app').classList.remove('hidden');$('#codeBadge').textContent=code;$('#roleBadge').textContent=role==='host'?'ведущий':'участник';$('#myUserDot').style.background=MYCOLOR;$('#myUserLabel').textContent=role==='host'?'Вы · ведущий':'Вы · участник';$('#clearBtn').classList.toggle('hidden',role!=='host');setColor(color);count();resize()}async function share(){const u=invite();$('#shareCode').textContent=code;$('#shareUrl').textContent=u;$('#shareModal').classList.remove('hidden');await QRCode.toCanvas($('#qrCanvas'),u,{width:186,margin:0})}$('#shareBtn').onclick=share;$('#closeShareBtn').onclick=()=>$('#shareModal').classList.add('hidden');$('#copyLinkBtn').onclick=async()=>{await navigator.clipboard.writeText(invite());toast('Ссылка скопирована')};$('#nativeShareBtn').onclick=()=>navigator.share?navigator.share({title:'Glued Canvas',url:invite()}):$('#copyLinkBtn').click();$('#undoBtn').onclick=()=>{const x=items.at(-1);x&&cmd({type:'undo',id:x.id},1)};$('#redoBtn').onclick=()=>{const x=redo.pop();x&&cmd({type:'redo',item:x},1)};$('#clearBtn').onclick=()=>role==='host'&&confirm('Очистить общий рисунок?')&&cmd({type:'clear'},1);
async function connect(c,r,restore=true){code=c;role=r;sessionStorage.setItem(ACTIVE,JSON.stringify({code,role}));if(restore)await loadState();else{items=[];redo=[];revision=0;updatedAt=Date.now();clearedAt=0;rebuildArt()}room=joinRoom({appId:APP},'room-'+code);draw=room.makeAction('draw');state=room.makeAction('state');cursors=room.makeAction('cursor');commands=room.makeAction('command');draw.onMessage=d=>{if(d.type==='start'&&!index.has(d.stroke.id)){const s=clone(d.stroke);items.push(s);index.set(s.id,items.length-1);segment(s,s.points[0])}if(d.type==='points'){const i=index.get(d.id);if(i!==undefined){const s=items[i];for(const p of d.points){const z=s.points.at(-1),q={...p};segment(s,z,q);s.points.push(q)}}}if(d.type==='end')touch();requestRender()};state.onMessage=(d,{peerId})=>{d.type==='snapshot'?applySnap(d):d.type==='request'&&state.send(snap(),{target:peerId})};cursors.onMessage=(d,{peerId})=>{remoteCursors.set(peerId,{...d,t:Date.now()});requestRender()};commands.onMessage=d=>{if(d.type==='clear'&&d.actorRole!=='host')return;cmd(d)};room.onPeerJoin=id=>{peerIds.add(id);count();$('#shareModal').classList.add('hidden');state.send(snap(),{target:id});state.send({type:'request'},{target:id})};room.onPeerLeave=id=>{peerIds.delete(id);remoteCursors.delete(id);count();requestRender()};openApp();state.send({type:'request'})}
$('#createBtn').onclick=async()=>{code=String(Math.floor(1000+Math.random()*9000));$('#roomCode').textContent=code;await connect(code,'host',false);setTimeout(share,200)};$('#joinBtn').onclick=()=>/^\d{4}$/.test($('#joinCode').value)&&connect($('#joinCode').value,'guest');const auto=new URL(location.href).searchParams.get('join');if(/^\d{4}$/.test(auto||'')){setMode('join');$('#joinCode').value=auto;connect(auto,'guest')}else{try{const a=JSON.parse(sessionStorage.getItem(ACTIVE)||'null');a?.code&&connect(a.code,a.role||'guest')}catch{}}lucide.createIcons();
