name: Add eraser tool
on:
  push:
    paths:
      - .github/workflows/add-eraser.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch eraser tool
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
            '<button class="toolBtn" data-tool="pen" title="Перо"><i data-lucide="pen-tool"></i></button><button class="toolBtn" data-tool="fill"',
            '<button class="toolBtn" data-tool="pen" title="Перо"><i data-lucide="pen-tool"></i></button><button class="toolBtn" data-tool="eraser" title="Ластик"><i data-lucide="eraser"></i></button><button class="toolBtn" data-tool="fill"'
          )

          s = s.replace(
            "penPreset='fine',penSize=5,penOpacity=1,penAngle=35,penContrast=.78,emoji='😀'",
            "penPreset='fine',penSize=5,penOpacity=1,penAngle=35,penContrast=.78,eraserMode='hard',eraserSize=36,kneadedStrength=.18,emoji='😀'"
          )

          anchor = "function getImage(src){if(imageCache.has(src))return imageCache.get(src);"
          eraser_fn = """function eraserStroke(c,s,scale,ox,oy){if(!s.points?.length)return;c.save();c.globalCompositeOperation='destination-out';const size=(s.width||36)*scale;if((s.mode||'hard')==='hard'){c.globalAlpha=1;c.strokeStyle='#000';c.fillStyle='#000';c.lineCap=c.lineJoin='round';if(s.points.length===1){const p=s.points[0];c.beginPath();c.arc(ox+p.x*scale,oy+p.y*scale,size/2,0,Math.PI*2);c.fill()}else{c.lineWidth=size;c.beginPath();c.moveTo(ox+s.points[0].x*scale,oy+s.points[0].y*scale);for(let i=1;i<s.points.length;i++)c.lineTo(ox+s.points[i].x*scale,oy+s.points[i].y*scale);c.stroke()}}else{const strength=Math.max(.04,Math.min(.65,s.strength??.18));c.globalAlpha=strength;for(let i=0;i<s.points.length;i++){const p=s.points[i],q=s.points[Math.max(0,i-1)],d=Math.max(1,Math.hypot(p.x-q.x,p.y-q.y)),steps=Math.max(1,Math.ceil(d/Math.max(2,(s.width||36)*.16)));for(let n=0;n<steps;n++){const t=steps===1?1:n/steps,x=(q.x+(p.x-q.x)*t)*scale+ox,y=(q.y+(p.y-q.y)*t)*scale+oy,r=size/2,g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.72)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}}}c.restore()}
"""
          if eraser_fn.strip() not in s:
            s = s.replace(anchor, eraser_fn + anchor)

          old_drawitem = "function drawItem(c,it,scale=view.scale,ox=view.x,oy=view.y){if(!it.kind||it.kind==='stroke'){if(it.tool==='brush')brushStroke(c,it,scale,ox,oy);else if(it.tool==='marker')markerStroke(c,it,scale,ox,oy);else if(it.tool==='pen')penStroke(c,it,scale,ox,oy);else pencilStroke(c,it,scale,ox,oy)}else{const e=getImage(it.src);if(e.ready){c.save();c.globalAlpha=it.opacity??1;c.drawImage(e.img,ox+it.x*scale,oy+it.y*scale,it.w*scale,it.h*scale);c.restore()}}}"
          new_drawitem = "function drawItem(c,it,scale=view.scale,ox=view.x,oy=view.y){if(it.kind==='erase'){eraserStroke(c,it,scale,ox,oy)}else if(!it.kind||it.kind==='stroke'){if(it.tool==='brush')brushStroke(c,it,scale,ox,oy);else if(it.tool==='marker')markerStroke(c,it,scale,ox,oy);else if(it.tool==='pen')penStroke(c,it,scale,ox,oy);else pencilStroke(c,it,scale,ox,oy)}else{const e=getImage(it.src);if(e.ready){c.save();c.globalAlpha=it.opacity??1;c.drawImage(e.img,ox+it.x*scale,oy+it.y*scale,it.w*scale,it.h*scale);c.restore()}}}"
          if old_drawitem not in s:
            raise SystemExit('drawItem anchor not found')
          s = s.replace(old_drawitem, new_drawitem)

          old_render = "function render(){computeView();ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#eceae5';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#fff';ctx.fillRect(view.x,view.y,WW*view.scale,WH*view.scale);ctx.save();ctx.beginPath();ctx.rect(view.x,view.y,WW*view.scale,WH*view.scale);ctx.clip();for(const it of items)drawItem(ctx,it);ctx.restore();ctx.strokeStyle='#0002';ctx.strokeRect(view.x+.5,view.y+.5,WW*view.scale-1,WH*view.scale-1);"
          new_render = "const artCanvas=document.createElement('canvas'),artCtx=artCanvas.getContext('2d');artCanvas.width=WW;artCanvas.height=WH;function renderArt(){artCtx.clearRect(0,0,WW,WH);for(const it of items)drawItem(artCtx,it,1,0,0)}function render(){computeView();renderArt();ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#eceae5';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#fff';ctx.fillRect(view.x,view.y,WW*view.scale,WH*view.scale);ctx.save();ctx.beginPath();ctx.rect(view.x,view.y,WW*view.scale,WH*view.scale);ctx.clip();ctx.drawImage(artCanvas,view.x,view.y,WW*view.scale,WH*view.scale);ctx.restore();ctx.strokeStyle='#0002';ctx.strokeRect(view.x+.5,view.y+.5,WW*view.scale-1,WH*view.scale-1);"
          if old_render not in s:
            raise SystemExit('render anchor not found')
          s = s.replace(old_render, new_render)

          old_raster = "async function rasterWorld(){await ensureImagesReady();const off=document.createElement('canvas');off.width=WW;off.height=WH;const c=off.getContext('2d',{willReadFrequently:true});c.fillStyle='#fff';c.fillRect(0,0,WW,WH);for(const it of items)drawItem(c,it,1,0,0);return off}"
          new_raster = "async function rasterWorld(){await ensureImagesReady();renderArt();const off=document.createElement('canvas');off.width=WW;off.height=WH;const c=off.getContext('2d',{willReadFrequently:true});c.fillStyle='#fff';c.fillRect(0,0,WW,WH);c.drawImage(artCanvas,0,0);return off}"
          if old_raster not in s:
            raise SystemExit('rasterWorld anchor not found')
          s = s.replace(old_raster, new_raster)

          old_pen_return = "if(activeTool==='pen'){const ws={fine:3,medium:6,broad:11,flat:16,pointed:penSize,decorative:Math.max(penSize,14),calligraphy:Math.max(penSize,17),poster:Math.max(penSize,28)};return{id,kind:'stroke',tool:'pen',preset:penPreset,nib:penPreset,color,width:ws[penPreset],opacity:penOpacity,pressure:pressureEnabled,angle:penAngle,contrast:penContrast,points:[p]}}}"
          new_pen_return = "if(activeTool==='pen'){const ws={fine:3,medium:6,broad:11,flat:16,pointed:penSize,decorative:Math.max(penSize,14),calligraphy:Math.max(penSize,17),poster:Math.max(penSize,28)};return{id,kind:'stroke',tool:'pen',preset:penPreset,nib:penPreset,color,width:ws[penPreset],opacity:penOpacity,pressure:pressureEnabled,angle:penAngle,contrast:penContrast,points:[p]}}if(activeTool==='eraser')return{id,kind:'erase',tool:'eraser',mode:eraserMode,width:eraserSize,strength:kneadedStrength,pressure:false,points:[p]}}"
          if old_pen_return not in s:
            raise SystemExit('newStroke anchor not found')
          s = s.replace(old_pen_return, new_pen_return)

          old_fill_branch = "else if(activeTool==='fill')el.innerHTML=`<div class=\"optionsRow\"><span class=\"optionsLabel\">Заливка</span><span>Нажмите внутри замкнутой области</span></div>`;else el.innerHTML="
          eraser_branch = "else if(activeTool==='eraser')el.innerHTML=`<div class=\"optionsRow\"><span class=\"optionsLabel\">Ластик</span><div class=\"seg\"><button data-erasermode=\"hard\" class=\"${eraserMode==='hard'?'active':''}\">Полный</button><button data-erasermode=\"kneaded\" class=\"${eraserMode==='kneaded'?'active':''}\">Клячка</button></div></div><div class=\"optionsRow\"><span class=\"optionsLabel\">Размер</span><input id=\"eraserSize\" class=\"range\" type=\"range\" min=\"6\" max=\"180\" value=\"${eraserSize}\"><span class=\"rangeValue\">${eraserSize}px</span></div>${eraserMode==='kneaded'?`<div class=\"optionsRow\"><span class=\"optionsLabel\">Сила</span><input id=\"kneadedStrength\" class=\"range\" type=\"range\" min=\"5\" max=\"55\" value=\"${Math.round(kneadedStrength*100)}\"><span class=\"rangeValue\">${Math.round(kneadedStrength*100)}%</span></div>`:''}`;else if(activeTool==='fill')el.innerHTML=`<div class=\"optionsRow\"><span class=\"optionsLabel\">Заливка</span><span>Нажмите внутри замкнутой области</span></div>`;else el.innerHTML="
          if old_fill_branch not in s:
            raise SystemExit('options branch anchor not found')
          s = s.replace(old_fill_branch, eraser_branch)

          bind_anchor = "bind('#penAngle',v=>penAngle=v,'°');bind('#emojiSize',v=>emojiSize=v);"
          bind_repl = "bind('#penAngle',v=>penAngle=v,'°');bind('#eraserSize',v=>eraserSize=v);bind('#kneadedStrength',v=>kneadedStrength=v/100,'%');bind('#emojiSize',v=>emojiSize=v);"
          if bind_anchor not in s:
            raise SystemExit('bind anchor not found')
          s = s.replace(bind_anchor, bind_repl)

          preset_anchor = "$$('[data-preset]').forEach(b=>b.onclick=()=>{if(activeTool==='brush')brushPreset=b.dataset.preset;if(activeTool==='marker'){markerPreset=b.dataset.preset;if(markerPreset==='highlighter')markerOpacity=.25}if(activeTool==='pen')penPreset=b.dataset.preset;renderOptions()});"
          preset_repl = preset_anchor + "$$('[data-erasermode]').forEach(b=>b.onclick=()=>{eraserMode=b.dataset.erasermode;renderOptions()});"
          if preset_anchor not in s:
            raise SystemExit('preset anchor not found')
          s = s.replace(preset_anchor, preset_repl)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add hard and kneaded eraser tool"
          git push
