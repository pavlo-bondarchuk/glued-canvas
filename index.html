canvas.onpointerdown=e=>{if(busy)return;if(e.button!==undefined&&e.button!==0)return;const p=pointFromEvent(e);if(!p.inside)return;if(activeTool==='fill'){performFill(p.x,p.y);return}if(activeTool==='emoji'){placeEmoji(p.x,p.y);return}drawing=true;canvas.setPointerCapture?.(e.pointerId);current=newStroke(p);items.push(current);index.set(current.id,items.length-1);redo=[];touch();draw?.send({type:'start',stroke:cloneItem(current)});sendCursor(p,1);render()};canvas.onpointermove=e=>{const p=pointFromEvent(e);if(activeTool==='emoji'){const g=$('#emojiGhost');g.textContent=emoji;g.style.fontSize=Math.max(26,emojiSize*view.scale)+'px';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';g.classList.toggle('hidden',!p.inside)}if(p.inside)sendCursor(p,drawing);if(!drawing||!current)return;const evs=e.getCoalescedEvents?.()||[e],added=[];for(const ce of evs){const q=pointFromEvent(ce);if(!q.inside)continue;const last=current.points.at(-1);if(Math.hypot(q.x-last.x,q.y-last.y)<.7)continue;current.points.push(q);added.push(q)}if(added.length)draw?.send({type:'points',id:current.id,points:added});scheduleSave();render()};function finish(e){if(e){const p=pointFromEvent(e);if(p.inside)sendCursor(p,false)}if(drawing&&current){draw?.send({type:'end',id:current.id});touch(false)}drawing=false;current=null;render()}canvas.onpointerup=canvas.onpointercancel=finish;canvas.onpointerleave=()=>$('#emojiGhost').classList.add('hidden');
async function ensureImagesReady(){await Promise.all(items.filter(x=>x.src).map(x=>new Promise(res=>{const e=getImage(x.src);if(e.ready)return res();e.img.addEventListener('load',()=>res(),{once:true})})))}async function rasterWorld(){await ensureImagesReady();const off=document.createElement('canvas');off.width=WW;off.height=WH;const c=off.getContext('2d',{willReadFrequently:true});c.fillStyle='#fff';c.fillRect(0,0,WW,WH);for(const it of items)drawItem(c,it,1,0,0);return off}
async function performFill(x,y){if(busy)return;busy=true;canvas.classList.add('busy');toast('Заливка…');try{const off=await rasterWorld(),c=off.getContext('2d',{willReadFrequently:true}),im=c.getImageData(0,0,WW,WH),d=im.data,sx=Math.max(0,Math.min(WW-1,Math.round(x))),sy=Math.max(0,Math.min(WH-1,Math.round(y))),si=(sy*WW+sx)*4,target=[d[si],d[si+1],d[si+2],d[si+3]],rgb=hexRgb(color),tol=36,seen=new Uint8Array(WW*WH),stack=[sy*WW+sx],changed=[];while(stack.length){const idx=stack.pop();if(seen[idx])continue;seen[idx]=1;const o=idx*4;if(Math.abs(d[o]-target[0])+Math.abs(d[o+1]-target[1])+Math.abs(d[o+2]-target[2])+Math.abs(d[o+3]-target[3])>tol)continue;d[o]=rgb[0];d[o+1]=rgb[1];d[o+2]=rgb[2];d[o+3]=255;changed.push(idx);const px=idx%WW,py=(idx/WW)|0;if(px>0)stack.push(idx-1);if(px<WW-1)stack.push(idx+1);if(py>0)stack.push(idx-WW);if(py<WH-1)stack.push(idx+WW)}if(!changed.length)return;let minx=WW,miny=WH,maxx=0,maxy=0;for(const idx of changed){const px=idx%WW,py=(idx/WW)|0;if(px<minx)minx=px;if(px>maxx)maxx=px;if(py<miny)miny=py;if(py>maxy)maxy=py}const mask=document.createElement('canvas');mask.width=maxx-minx+1;mask.height=maxy-miny+1;const mc=mask.getContext('2d'),out=mc.createImageData(mask.width,mask.height),od=out.data;for(const idx of changed){const px=idx%WW-minx,py=((idx/WW)|0)-miny,o=(py*mask.width+px)*4;od[o]=rgb[0];od[o+1]=rgb[1];od[o+2]=rgb[2];od[o+3]=255}mc.putImageData(out,0,0);addObject({id:crypto.randomUUID?.()||Date.now()+'-'+Math.random(),kind:'fill',src:mask.toDataURL('image/png'),x:minx,y:miny,w:mask.width,h:mask.height})}catch{toast('Заливка не удалась')}finally{busy=false;canvas.classList.remove('busy')}}
function emojiImage(ch){const size=256,off=document.createElement('canvas');off.width=off.height=size;const c=off.getContext('2d');c.textAlign='center';c.textBaseline='middle';c.font='200px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';c.fillText(ch,size/2,size/2+4);return off.toDataURL('image/png')}function placeEmoji(x,y){const s=emojiSize;addObject({id:crypto.randomUUID?.()||Date.now()+'-'+Math.random(),kind:'emoji',src:emojiImage(emoji),x:x-s/2,y:y-s/2,w:s,h:s})}function addObject(it){items.push(it);index.set(it.id,items.length-1);redo=[];touch();commands?.send({type:'add',item:it,actorRole:role});render()}
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))),q=n=>Math.round(255*f(n)).toString(16).padStart(2,'0');return'#'+q(0)+q(8)+q(4)}
function cmd(d,send=false){if(d.type==='clear'&&send&&role!=='host'){toast('Очистить холст может только ведущий');return}if(d.type==='clear'){items=[];redo=[];index.clear();revision++;updatedAt=Date.now()}if(d.type==='undo'){const id=d.id||items.at(-1)?.id,i=index.get(id);if(i!==undefined){const[r]=items.splice(i,1);redo.push(r);rebuild();revision++;updatedAt=Date.now();d={...d,id}}}if(d.type==='redo'){const s=d.item||redo.at(-1);if(s&&!index.has(s.id)){const i=redo.findIndex(x=>x.id===s.id);if(i>=0)redo.splice(i,1);items.push(cloneItem(s));rebuild();revision++;updatedAt=Date.now();d={...d,item:s}}}if(d.type==='add'&&d.item&&!index.has(d.item.id)){items.push(cloneItem(d.item));rebuild();revision++;updatedAt=Date.now()}render();scheduleSave();if(send)commands?.send({...d,actorRole:role})}
$('#undoBtn').onclick=()=>{const id=items.at(-1)?.id;if(id)cmd({type:'undo',id},1)};$('#redoBtn').onclick=()=>{const s=redo.at(-1);if(s)cmd({type:'redo',item:s},1)};$('#clearBtn').onclick=()=>{if(role!=='host')return toast('Очистить холст может только ведущий');confirm('Очистить общий рисунок?')&&cmd({type:'clear'},1)};
function setColor(c){color=c;document.documentElement.style.setProperty('--active-color',c);$$('.sw[data-color]').forEach(x=>x.classList.toggle('active',x.dataset.color.toLowerCase()===c.toLowerCase()));$('#colorPreview').style.background=c;renderOptions()}$$('.sw[data-color]').forEach(b=>b.onclick=()=>setColor(b.dataset.color));function setTool(t){activeTool=t;$$('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('#emojiGhost').classList.add('hidden');renderOptions()}$$('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function renderOptions(){const el=$('#toolOptions');if(activeTool==='pencil'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Карандаш</span><input id="pencilSize" class="range" type="range" min="1" max="18" value="${pencilSize}"><span class="rangeValue">${pencilSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span><button id="pressureToggle" class="toggle ${pressureEnabled?'on':''}"></button><span style="font-size:12px;color:#777">стилус / сенсор</span></div>`}else if(activeTool==='brush'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Кисть</span><div class="seg"><button data-brush="round" class="${brushType==='round'?'active':''}"><i data-lucide="circle"></i>Круглая</button><button data-brush="marker" class="${brushType==='marker'?'active':''}"><i data-lucide="highlighter"></i>Маркер</button><button data-brush="calligraphy" class="${brushType==='calligraphy'?'active':''}"><i data-lucide="pen-tool"></i>Перо</button></div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="brushSize" class="range" type="range" min="4" max="72" value="${brushSize}"><span class="rangeValue">${brushSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Прозр.</span><input id="brushOpacity" class="range" type="range" min="10" max="100" value="${Math.round(brushOpacity*100)}"><span class="rangeValue">${Math.round(brushOpacity*100)}%</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span><button id="pressureToggle" class="toggle ${pressureEnabled?'on':''}"></button></div>`}else if(activeTool==='fill'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Заливка</span><span style="font-size:12px;color:#666">Нажмите внутри замкнутой области · <b style="color:${color}">${color}</b></span></div>`}else{el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Эмоджи</span><div class="emojiGrid">${['😀','😂','😍','😎','🤩','🥳','❤️','🔥','⭐','✨','👍','👏','🎨','🚀','🌈','🌸'].map(x=>`<button data-emoji="${x}" class="${emoji===x?'active':''}">${x}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="emojiSize" class="range" type="range" min="36" max="240" value="${emojiSize}"><span class="rangeValue">${emojiSize}px</span></div>`}lucide.createIcons();$('#pencilSize')?.addEventListener('input',e=>{pencilSize=+e.target.value;e.target.nextElementSibling.textContent=pencilSize+'px'});$('#brushSize')?.addEventListener('input',e=>{brushSize=+e.target.value;e.target.nextElementSibling.textContent=brushSize+'px'});$('#brushOpacity')?.addEventListener('input',e=>{brushOpacity=+e.target.value/100;e.target.nextElementSibling.textContent=Math.round(brushOpacity*100)+'%'});$('#emojiSize')?.addEventListener('input',e=>{emojiSize=+e.target.value;e.target.nextElementSibling.textContent=emojiSize+'px'});$('#pressureToggle')?.addEventListener('click',()=>{pressureEnabled=!pressureEnabled;renderOptions()});$$('[data-brush]').forEach(b=>b.onclick=()=>{brushType=b.dataset.brush;if(brushType==='marker'&&brushOpacity===1)brushOpacity=.28;renderOptions()});$$('[data-emoji]').forEach(b=>b.onclick=()=>{emoji=b.dataset.emoji;renderOptions()})}
$('#customColorBtn').onclick=()=>$('#colorPopover').classList.toggle('hidden');$('#closeColor').onclick=()=>$('#colorPopover').classList.add('hidden');function wheelPick(e){const r=$('#colorWheel').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,rad=Math.atan2(dy,dx),dist=Math.min(r.width/2,Math.hypot(dx,dy));hue=(rad*180/Math.PI+360)%360;sat=Math.max(18,Math.min(100,dist/(r.width/2)*100));const mr=$('#wheelMarker');mr.style.left=50+Math.cos(rad)*(sat/100)*50+'%';mr.style.top=50+Math.sin(rad)*(sat/100)*50+'%';setColor(hslToHex(hue,sat,light))}$('#colorWheel').onpointerdown=e=>{e.currentTarget.setPointerCapture?.(e.pointerId);wheelPick(e)};$('#colorWheel').onpointermove=e=>{if(e.buttons)wheelPick(e)};$('#lightness').oninput=e=>{light=+e.target.value;setColor(hslToHex(hue,sat,light))};

async function openShare(){const u=invite();$('#shareCode').textContent=code;$('#shareUrl').textContent=u;$('#shareModal').classList.remove('hidden');try{await QRCode.toCanvas($('#qrCanvas'),u,{width:186,margin:0,errorCorrectionLevel:'M'})}catch{toast('Не удалось создать QR')}}function closeShare(){$('#shareModal').classList.add('hidden')}async function copy(){try{await navigator.clipboard.writeText(invite());toast('Ссылка скопирована')}catch{toast('Не удалось скопировать')}}async function share(){if(!navigator.share)return copy();try{await navigator.share({title:'Glued Canvas',text:'Присоединяйся к комнате '+code,url:invite()})}catch(e){if(e.name!=='AbortError')copy()}}$('#shareBtn').onclick=openShare;$('#closeShareBtn').onclick=closeShare;$('#shareModal').onpointerdown=e=>{if(e.target===$('#shareModal'))closeShare()};$('#copyLinkBtn').onclick=copy;$('#nativeShareBtn').onclick=share;$('#codeBadge').onclick=async()=>{try{await navigator.clipboard.writeText(code);toast('Код '+code+' скопирован')}catch{}};
async function connect(c,r,restore=true){code=c;role=r;sessionStorage.setItem(ACTIVE,JSON.stringify({code,role}));if(restore)await loadState();else{items=[];redo=[];revision=0;updatedAt=Date.now();rebuild();scheduleSave()}room=joinRoom({appId:APP},'room-'+code,{onJoinError:e=>toast('Ошибка соединения: '+(e?.message||e))});draw=room.makeAction('draw');state=room.makeAction('state');cursors=room.makeAction('cursor');commands=room.makeAction('command');draw.onMessage=d=>{if(d.type==='start'&&!index.has(d.stroke.id)){items.push(cloneItem(d.stroke));index.set(d.stroke.id,items.length-1);redo=[];updatedAt=Date.now()}if(d.type==='points'){const i=index.get(d.id);if(i!==undefined)items[i].points.push(...(d.points||[]).map(p=>({...p})))}if(d.type==='end')touch();render()};cursors.onMessage=(d,{peerId})=>{remoteCursors.set(peerId,{...d,updated:Date.now()});render()};state.onMessage=(d,{peerId})=>{if(d.type==='snapshot')applySnapshot(d);if(d.type==='request')state.send(snapshot(),{target:peerId})};commands.onMessage=d=>{if(d.type==='clear'&&d.actorRole!=='host')return;cmd(d)};room.onPeerJoin=id=>{peerIds.add(id);count();toast('Участник подключён');closeShare();state.send(snapshot(),{target:id});state.send({type:'request'},{target:id});cursors.send({x:WW/2,y:WH/2,active:false,color:MYCOLOR,label:role==='host'?'Ведущий':'Участник'},{target:id})};room.onPeerLeave=id=>{peerIds.delete(id);remoteCursors.delete(id);count();render();toast('Участник отключён')};openApp();resize();state.send({type:'request'})}
$('#createBtn').onclick=async()=>{code=randomCode();$('#roomCode').textContent=code;status('#hostStatus','Комната '+code+' создана',1);await connect(code,'host',false);setTimeout(openShare,200)};$('#joinBtn').onclick=async()=>{const c=$('#joinCode').value.trim();if(!/^\d{4}$/.test(c))return status('#joinStatus','Нужны 4 цифры');status('#joinStatus','Подключаемся…',1);await connect(c,'guest')};const auto=new URL(location.href).searchParams.get('join');if(/^\d{4}$/.test(auto||'')){setMode('join');$('#joinCode').value=auto;status('#joinStatus','Подключаемся к комнате '+auto+'…',1);connect(auto,'guest')}else{try{const a=JSON.parse(sessionStorage.getItem(ACTIVE)||'null');if(a&&/^\d{4}$/.test(a.code||'')){setMode(a.role==='host'?'host':'join');connect(a.code,a.role||'guest')}}catch{}}
