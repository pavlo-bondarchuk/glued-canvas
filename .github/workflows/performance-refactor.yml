name: Performance refactor

on:
  push:
    paths:
      - '.github/workflows/performance-refactor.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch incremental canvas rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          render_new="""function getImage(src){if(imageCache.has(src))return imageCache.get(src);const img=new Image(),e={img,ready:false};img.onload=()=>{e.ready=true;rebuildArt();requestRender()};img.src=src;imageCache.set(src,e);return e}function drawItem(c,it,scale=view.scale,ox=view.x,oy=view.y){if(it.kind==='erase')eraserStroke(c,it,scale,ox,oy);else if(it.kind==='smudge')smudgeStroke(c,it,scale,ox,oy);else if(!it.kind||it.kind==='stroke'){if(it.tool==='brush')brushStroke(c,it,scale,ox,oy);else if(it.tool==='marker')markerStroke(c,it,scale,ox,oy);else if(it.tool==='pen')penStroke(c,it,scale,ox,oy);else pencilStroke(c,it,scale,ox,oy)}else{const e=getImage(it.src);if(e.ready){c.save();c.globalAlpha=it.opacity??1;c.drawImage(e.img,ox+it.x*scale,oy+it.y*scale,it.w*scale,it.h*scale);c.restore()}}}
          const artCanvas=document.createElement('canvas'),artCtx=artCanvas.getContext('2d');artCanvas.width=WW;artCanvas.height=WH;let renderFrame=0;function rebuildArt(){artCtx.clearRect(0,0,WW,WH);for(const it of items)drawItem(artCtx,it,1,0,0)}function drawIncrement(it,a,b){if(!it||!a)return;const seg={...it,points:b?[a,b]:[a]};drawItem(artCtx,seg,1,0,0)}function render(){renderFrame=0;computeView();ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#eceae5';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#fff';ctx.fillRect(view.x,view.y,WW*view.scale,WH*view.scale);ctx.save();ctx.beginPath();ctx.rect(view.x,view.y,WW*view.scale,WH*view.scale);ctx.clip();ctx.drawImage(artCanvas,view.x,view.y,WW*view.scale,WH*view.scale);ctx.restore();ctx.strokeStyle='#0002';ctx.strokeRect(view.x+.5,view.y+.5,WW*view.scale-1,WH*view.scale-1);const now=Date.now();for(const[id,c]of remoteCursors){if(now-c.updated>3000){remoteCursors.delete(id);continue}const p=sp(c);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=c.color;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.font='600 12px Inter,system-ui';const label=c.label||'Участник',tw=ctx.measureText(label).width+14;ctx.fillStyle=c.color;ctx.beginPath();ctx.roundRect(11,-22,tw,24,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(label,18,-6);ctx.restore()}}function requestRender(){if(!renderFrame)renderFrame=requestAnimationFrame(render)}function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);render()}addEventListener('resize',resize);"""
          s,n=re.subn(r"function getImage\(src\).*?addEventListener\('resize',resize\);",render_new,s,count=1,flags=re.S)
          assert n==1, 'render block not found'
          pointer_new="""function closeOptions(){$('#toolOptions').classList.add('hidden');hideToolPreview()}canvas.onpointerdown=e=>{closeOptions();if(busy||e.button!==undefined&&e.button!==0)return;const p=pe(e);if(!p.inside)return;if(activeTool==='fill'){performFill(p.x,p.y);return}if(activeTool==='emoji'){placeEmoji(p.x,p.y);return}drawing=true;canvas.setPointerCapture?.(e.pointerId);current=newStroke(p);if(!current)return;items.push(current);index.set(current.id,items.length-1);redo=[];touch();drawIncrement(current,p);draw?.send({type:'start',stroke:cloneItem(current)});sendCursor(p,1);requestRender()};canvas.onpointermove=e=>{const p=pe(e);if(activeTool==='emoji'){const g=$('#emojiGhost');g.textContent=emoji;g.style.fontSize=Math.max(26,emojiSize*view.scale)+'px';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';g.classList.toggle('hidden',!p.inside)}if(p.inside)sendCursor(p,drawing);if(!drawing||!current)return;const evs=e.getCoalescedEvents?.()||[e],added=[];for(const ce of evs){const q=pe(ce);if(!q.inside)continue;const z=current.points.at(-1);if(Math.hypot(q.x-z.x,q.y-z.y)<.7)continue;drawIncrement(current,z,q);current.points.push(q);added.push(q)}if(added.length)draw?.send({type:'points',id:current.id,points:added});scheduleSave();requestRender()};function finish(e){if(e){const p=pe(e);if(p.inside)sendCursor(p,false)}if(drawing&&current){draw?.send({type:'end',id:current.id});touch(false)}drawing=false;current=null;requestRender()}canvas.onpointerup=canvas.onpointercancel=finish;canvas.onpointerleave=()=>$('#emojiGhost').classList.add('hidden');"""
          s,n=re.subn(r"function closeOptions\(\).*?canvas\.onpointerleave=\(\)=>\$\('#emojiGhost'\)\.classList\.add\('hidden'\);",pointer_new,s,count=1,flags=re.S)
          assert n==1, 'pointer block not found'
          s=s.replace("async function rasterWorld(){await ensureImagesReady();renderArt();const off=document.createElement('canvas');","async function rasterWorld(){await ensureImagesReady();const off=document.createElement('canvas');")
          s=s.replace("function addObject(it){items.push(it);index.set(it.id,items.length-1);redo=[];touch();commands?.send({type:'add',item:it,actorRole:role});render()}","function addObject(it){items.push(it);index.set(it.id,items.length-1);redo=[];touch();drawItem(artCtx,it,1,0,0);commands?.send({type:'add',item:it,actorRole:role});requestRender()}")
          cmd_new="""function cmd(d,send=false){if(d.type==='clear'&&send&&role!=='host')return;let changed=false;if(d.type==='clear'){items=[];redo=[];index.clear();revision++;changed=true}if(d.type==='undo'){const i=index.get(d.id);if(i!==undefined){redo.push(items.splice(i,1)[0]);rebuild();revision++;changed=true}}if(d.type==='redo'&&d.item&&!index.has(d.item.id)){items.push(cloneItem(d.item));rebuild();revision++;changed=true}if(d.type==='add'&&d.item&&!index.has(d.item.id)){items.push(cloneItem(d.item));rebuild();revision++;changed=true}if(changed)rebuildArt();updatedAt=Date.now();requestRender();scheduleSave();if(send)commands?.send({...d,actorRole:role})}"""
          s,n=re.subn(r"function cmd\(d,send=false\)\{.*?if\(send\)commands\?\.send\(\{\.\.\.d,actorRole:role\}\)\}",cmd_new,s,count=1,flags=re.S)
          assert n==1, 'cmd block not found'
          s=s.replace("items=arr.map(cloneItem);redo=[];revision=d.revision||0;updatedAt=d.updatedAt||Date.now();rebuild();render();scheduleSave()","items=arr.map(cloneItem);redo=[];revision=d.revision||0;updatedAt=d.updatedAt||Date.now();rebuild();rebuildArt();requestRender();scheduleSave()")
          s=s.replace("updatedAt=d.updatedAt||0;rebuild();return true","updatedAt=d.updatedAt||0;rebuild();rebuildArt();return true")
          remote_new="""draw.onMessage=d=>{if(d.type==='start'&&!index.has(d.stroke.id)){const stroke=cloneItem(d.stroke);items.push(stroke);index.set(stroke.id,items.length-1);if(stroke.points?.[0])drawIncrement(stroke,stroke.points[0])}if(d.type==='points'){const i=index.get(d.id);if(i!==undefined){const stroke=items[i];for(const p of d.points){const q={...p},z=stroke.points.at(-1);if(z)drawIncrement(stroke,z,q);stroke.points.push(q)}}}if(d.type==='end')touch();requestRender()};state.onMessage=(d,{peerId})=>{if(d.type==='snapshot')applySnapshot(d);if(d.type==='request')state.send(snapshot(),{target:peerId})};cursors.onMessage=(d,{peerId})=>{remoteCursors.set(peerId,{...d,updated:Date.now()});requestRender()};commands.onMessage=d=>{if(d.type==='clear'&&d.actorRole!=='host')return;cmd(d)};room.onPeerJoin=id=>{peerIds.add(id);count();closeShare();state.send(snapshot(),{target:id});state.send({type:'request'},{target:id})};room.onPeerLeave=id=>{peerIds.delete(id);remoteCursors.delete(id);count();requestRender()};"""
          s,n=re.subn(r"draw\.onMessage=d=>\{.*?room\.onPeerLeave=id=>\{.*?\};",remote_new,s,count=1,flags=re.S)
          assert n==1, 'remote block not found'
          s=s.replace("smudgeScratch.width=Math.ceil(sw);smudgeScratch.height=Math.ceil(sh);smudgeScratchCtx.clearRect(0,0,smudgeScratch.width,smudgeScratch.height);","const rw=Math.ceil(sw),rh=Math.ceil(sh);if(smudgeScratch.width!==rw||smudgeScratch.height!==rh){smudgeScratch.width=rw;smudgeScratch.height=rh}else smudgeScratchCtx.clearRect(0,0,rw,rh);")
          assert 'renderArt()' not in s
          assert 'function rebuildArt()' in s and 'function drawIncrement' in s
          p.write_text(s)
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/app.mjs').write_text(s[a:b])
          PY
          node --check /tmp/app.mjs
      - name: Commit optimized renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Optimize incremental canvas rendering"
          git push
