name: Brush engine v2 upgrade
on:
  push:
    paths:
      - .github/workflows/brush-engine-v2.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upgrade tools and stroke engine
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = s.replace(
            '<button class="toolBtn" data-tool="brush" title="Кисть"><i data-lucide="paintbrush"></i></button><button class="toolBtn" data-tool="fill"',
            '<button class="toolBtn" data-tool="brush" title="Кисть"><i data-lucide="paintbrush"></i></button><button class="toolBtn" data-tool="marker" title="Маркер"><i data-lucide="highlighter"></i></button><button class="toolBtn" data-tool="pen" title="Перо"><i data-lucide="pen-tool"></i></button><button class="toolBtn" data-tool="fill"'
          )

          s = s.replace(
            "activeTool='pencil',brushType='round',pencilSize=5,brushSize=18,brushOpacity=1,pressureEnabled=true,emoji='😀'",
            "activeTool='pencil',brushPreset='round',markerPreset='narrow',penPreset='fine',pencilSize=5,brushSize=18,brushOpacity=1,brushAngle=25,brushSoftness=.18,markerSize=12,markerOpacity=.92,markerAngle=35,penSize=5,penOpacity=1,penAngle=35,penContrast=.78,pressureEnabled=true,emoji='😀'"
          )

          old_render = re.compile(r"function widthAt\(s,p,scale\).*?function getImage\(src\)", re.S)
          new_render = r'''function pressureScale(s,p){if(s.pressure===false||p?.pressure===undefined)return 1;const v=Math.max(.01,Math.min(1,p.pressure));return .28+Math.pow(v,.72)*1.55}
function widthAt(s,p,scale){return Math.max(.65,(s.width||7)*pressureScale(s,p)*scale)}
function stampAngle(s,p,prev){if(Number.isFinite(p?.azimuthAngle)&&p.pointerType==='pen')return p.azimuthAngle;const fixed=(s.angle??0)*Math.PI/180;if(s.followDirection&&prev)return Math.atan2(p.y-prev.y,p.x-prev.x)+fixed;return fixed}
function stampStroke(c,s,scale,ox,oy){if(!s.points?.length)return;c.save();c.globalAlpha=s.opacity??1;c.fillStyle=s.color;const shape=s.shape||'round',aspect=s.aspect||1,soft=s.softness||0;for(let i=0;i<s.points.length;i++){const p=s.points[i],prev=s.points[Math.max(0,i-1)],dx=p.x-prev.x,dy=p.y-prev.y,dist=Math.max(1,Math.hypot(dx,dy)),step=Math.max(1.2,(s.width||12)*.14),steps=i?Math.max(1,Math.ceil(dist/step)):1;for(let n=0;n<steps;n++){const t=steps===1?1:n/steps,q={...p,x:prev.x+(p.x-prev.x)*t,y:prev.y+(p.y-prev.y)*t,pressure:(prev.pressure??p.pressure)+(p.pressure-(prev.pressure??p.pressure))*t},w=(s.width||12)*pressureScale(s,q)*scale,h=w*aspect,a=stampAngle(s,q,prev),x=ox+q.x*scale,y=oy+q.y*scale;c.save();c.translate(x,y);c.rotate(a);if(soft>0){const g=c.createRadialGradient(0,0,0,0,0,w/2);g.addColorStop(0,s.color);g.addColorStop(Math.max(.05,1-soft),s.color);g.addColorStop(1,s.color+'00');c.fillStyle=g}else c.fillStyle=s.color;c.beginPath();if(shape==='flat')c.roundRect(-w/2,-h/2,w,h,Math.min(h/2,Math.max(1,w*.06)));else c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);c.fill();c.restore()}}c.restore()}
function markerStroke(c,s,scale,ox,oy){if(!s.points?.length)return;c.save();c.globalAlpha=s.opacity??1;c.fillStyle=s.color;const shape=s.shape||'round',angle=(s.angle??0)*Math.PI/180,w=(s.width||12)*scale,h=w*(s.aspect||.45);for(let i=0;i<s.points.length;i++){const p=s.points[i],prev=s.points[Math.max(0,i-1)],dist=Math.max(1,Math.hypot(p.x-prev.x,p.y-prev.y)),steps=Math.max(1,Math.ceil(dist/Math.max(1,w/scale*.12)));for(let n=0;n<steps;n++){const t=steps===1?1:n/steps,x=(prev.x+(p.x-prev.x)*t)*scale+ox,y=(prev.y+(p.y-prev.y)*t)*scale+oy;c.save();c.translate(x,y);c.rotate(angle);c.beginPath();if(shape==='round')c.ellipse(0,0,w/2,w/2,0,0,Math.PI*2);else c.roundRect(-w/2,-h/2,w,h,Math.min(h*.22,3*scale));c.fill();c.restore()}}c.restore()}
function penStroke(c,s,scale,ox,oy){if(!s.points?.length)return;c.save();c.globalAlpha=s.opacity??1;c.fillStyle=s.color;const mode=s.nib||'pointed';for(let i=0;i<s.points.length;i++){const p=s.points[i],prev=s.points[Math.max(0,i-1)],dx=p.x-prev.x,dy=p.y-prev.y,dist=Math.max(1,Math.hypot(dx,dy)),steps=Math.max(1,Math.ceil(dist/2));for(let n=0;n<steps;n++){const t=steps===1?1:n/steps,pr=(prev.pressure??p.pressure??.5)+((p.pressure??.5)-(prev.pressure??p.pressure??.5))*t,x=(prev.x+(p.x-prev.x)*t)*scale+ox,y=(prev.y+(p.y-prev.y)*t)*scale+oy,base=(s.width||6)*scale,contrast=s.contrast??.75;c.save();c.translate(x,y);if(mode==='pointed'||mode==='fine'||mode==='medium'||mode==='broad'){const k=s.pressure===false?.55:Math.max(.08,pr),ww=base*((1-contrast)+k*contrast*2.1);c.beginPath();c.arc(0,0,Math.max(.45,ww/2),0,Math.PI*2);c.fill()}else{let angle=(s.angle??35)*Math.PI/180;if(Number.isFinite(p.azimuthAngle)&&p.pointerType==='pen'&&mode==='fude')angle=p.azimuthAngle;c.rotate(angle);let aspect=mode==='poster'?.16:mode==='decorative'?.28:.22,ww=base*(s.pressure===false?1:.7+pr*.55);c.beginPath();if(mode==='decorative'){c.moveTo(-ww/2,0);c.quadraticCurveTo(0,-ww*aspect,ww/2,0);c.quadraticCurveTo(0,ww*aspect,-ww/2,0)}else c.roundRect(-ww/2,-ww*aspect/2,ww,Math.max(1,ww*aspect),Math.max(.5,ww*.03));c.fill()}c.restore()}}c.restore()}
function drawRound(c,s,scale,ox,oy){stampStroke(c,{...s,shape:'round',aspect:1,softness:0},scale,ox,oy)}
function drawCalligraphy(c,s,scale,ox,oy){penStroke(c,{...s,nib:'calligraphy'},scale,ox,oy)}
function getImage(src)'''
          s, n = old_render.subn(new_render, s, count=1)
          if n != 1:
            raise SystemExit('render block not found')

          s = s.replace(
            "function drawItem(c,it,scale=view.scale,ox=view.x,oy=view.y){if(!it.kind||it.kind==='stroke'){if(it.brush==='calligraphy')drawCalligraphy(c,it,scale,ox,oy);else drawRound(c,it,scale,ox,oy)}else drawImage(c,it,scale,ox,oy)}",
            "function drawItem(c,it,scale=view.scale,ox=view.x,oy=view.y){if(!it.kind||it.kind==='stroke'){if(it.tool==='marker'||it.engine==='marker')markerStroke(c,it,scale,ox,oy);else if(it.tool==='pen'||it.engine==='pen'||it.brush==='calligraphy')penStroke(c,it,scale,ox,oy);else if(it.tool==='brush'||it.engine==='brush')stampStroke(c,it,scale,ox,oy);else drawRound(c,it,scale,ox,oy)}else drawImage(c,it,scale,ox,oy)}"
          )

          s = re.sub(
            r"function sendCursor\(p,a=true\)\{.*?\}function newStroke\(p\)\{.*?\}\n",
            "function sendCursor(p,a=true){lastPointer={x:p.x,y:p.y,active:a,color:MYCOLOR,label:role==='host'?'Ведущий':'Участник'};if(cursorFrame)return;cursorFrame=requestAnimationFrame(()=>{cursorFrame=0;cursors?.send(lastPointer)})}function newStroke(p){const id=crypto.randomUUID?.()||Date.now()+'-'+Math.random();if(activeTool==='pencil')return{id,kind:'stroke',tool:'pencil',brush:'pencil',color,width:pencilSize,opacity:1,pressure:pressureEnabled,points:[p]};if(activeTool==='brush'){const presets={round:{shape:'round',aspect:1},oval:{shape:'oval',aspect:.55},flat:{shape:'flat',aspect:.28}}[brushPreset];return{id,kind:'stroke',tool:'brush',engine:'brush',preset:brushPreset,color,width:brushSize,opacity:brushOpacity,pressure:pressureEnabled,angle:brushAngle,softness:brushSoftness,followDirection:brushPreset==='oval',...presets,points:[p]}}if(activeTool==='marker'){const presets={narrow:{width:markerSize,shape:'round',aspect:1},wide:{width:Math.max(markerSize,24),shape:'flat',aspect:.42},chisel:{width:Math.max(markerSize,22),shape:'flat',aspect:.28},highlighter:{width:Math.max(markerSize,30),shape:'flat',aspect:.38}}[markerPreset];return{id,kind:'stroke',tool:'marker',engine:'marker',preset:markerPreset,color,width:presets.width,shape:presets.shape,aspect:presets.aspect,angle:markerPreset==='chisel'?markerAngle:0,opacity:markerPreset==='highlighter'?Math.min(markerOpacity,.3):markerOpacity,pressure:false,points:[p]}}if(activeTool==='pen'){const widths={fine:3,medium:6,broad:11,flat:16,pointed:penSize,decorative:Math.max(penSize,14),calligraphy:Math.max(penSize,17),poster:Math.max(penSize,28)};return{id,kind:'stroke',tool:'pen',engine:'pen',preset:penPreset,nib:penPreset,color,width:widths[penPreset]||penSize,opacity:penOpacity,pressure:pressureEnabled,angle:penAngle,contrast:penContrast,points:[p]}}return{id,kind:'stroke',tool:activeTool,color,width:7,opacity:1,pressure:pressureEnabled,points:[p]}}\n",
            s,
            count=1,
            flags=re.S
          )

          options = r'''function renderOptions(){const el=$('#toolOptions');if(activeTool==='pencil'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Карандаш</span><input id="pencilSize" class="range" type="range" min="1" max="18" value="${pencilSize}"><span class="rangeValue">${pencilSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span><button id="pressureToggle" class="toggle ${pressureEnabled?'on':''}"></button><span style="font-size:12px;color:#777">стилус / сенсор</span></div>`}else if(activeTool==='brush'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Кисть</span><div class="seg"><button data-brushpreset="round" class="${brushPreset==='round'?'active':''}">Круглая</button><button data-brushpreset="oval" class="${brushPreset==='oval'?'active':''}">Овальная</button><button data-brushpreset="flat" class="${brushPreset==='flat'?'active':''}">Плоская</button></div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="brushSize" class="range" type="range" min="3" max="80" value="${brushSize}"><span class="rangeValue">${brushSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Мягкость</span><input id="brushSoftness" class="range" type="range" min="0" max="70" value="${Math.round(brushSoftness*100)}"><span class="rangeValue">${Math.round(brushSoftness*100)}%</span></div><div class="optionsRow"><span class="optionsLabel">Угол</span><input id="brushAngle" class="range" type="range" min="0" max="180" value="${brushAngle}"><span class="rangeValue">${brushAngle}°</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span><button id="pressureToggle" class="toggle ${pressureEnabled?'on':''}"></button></div>`}else if(activeTool==='marker'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Маркер</span><div class="seg presetWrap"><button data-markerpreset="narrow" class="${markerPreset==='narrow'?'active':''}">Узкий</button><button data-markerpreset="wide" class="${markerPreset==='wide'?'active':''}">Широкий</button><button data-markerpreset="chisel" class="${markerPreset==='chisel'?'active':''}">Скошенный</button><button data-markerpreset="highlighter" class="${markerPreset==='highlighter'?'active':''}">Выделитель</button></div></div><div class="optionsRow"><span class="optionsLabel">Ширина</span><input id="markerSize" class="range" type="range" min="4" max="64" value="${markerSize}"><span class="rangeValue">${markerSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Прозр.</span><input id="markerOpacity" class="range" type="range" min="10" max="100" value="${Math.round(markerOpacity*100)}"><span class="rangeValue">${Math.round(markerOpacity*100)}%</span></div><div class="optionsRow"><span class="optionsLabel">Угол</span><input id="markerAngle" class="range" type="range" min="0" max="180" value="${markerAngle}"><span class="rangeValue">${markerAngle}°</span></div>`}else if(activeTool==='pen'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Перо</span><div class="seg presetWrap penPresets">${[['fine','Тонкое'],['medium','Среднее'],['broad','Широкое'],['flat','Плоское'],['pointed','С точкой'],['decorative','Фигурное'],['calligraphy','Каллиграфия'],['poster','Плакатное']].map(([v,n])=>`<button data-penpreset="${v}" class="${penPreset===v?'active':''}">${n}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="penSize" class="range" type="range" min="2" max="48" value="${penSize}"><span class="rangeValue">${penSize}px</span></div><div class="optionsRow"><span class="optionsLabel">Контраст</span><input id="penContrast" class="range" type="range" min="0" max="100" value="${Math.round(penContrast*100)}"><span class="rangeValue">${Math.round(penContrast*100)}%</span></div><div class="optionsRow"><span class="optionsLabel">Угол</span><input id="penAngle" class="range" type="range" min="0" max="180" value="${penAngle}"><span class="rangeValue">${penAngle}°</span></div><div class="optionsRow"><span class="optionsLabel">Нажим</span><button id="pressureToggle" class="toggle ${pressureEnabled?'on':''}"></button></div>`}else if(activeTool==='fill'){el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Заливка</span><span style="font-size:12px;color:#666">Нажмите внутри замкнутой области · <b style="color:${color}">${color}</b></span></div>`}else{el.innerHTML=`<div class="optionsRow"><span class="optionsLabel">Эмоджи</span><div class="emojiGrid">${['😀','😂','😍','😎','🤩','🥳','❤️','🔥','⭐','✨','👍','👏','🎨','🚀','🌈','🌸'].map(x=>`<button data-emoji="${x}" class="${emoji===x?'active':''}">${x}</button>`).join('')}</div></div><div class="optionsRow"><span class="optionsLabel">Размер</span><input id="emojiSize" class="range" type="range" min="36" max="240" value="${emojiSize}"><span class="rangeValue">${emojiSize}px</span></div>`}lucide.createIcons();const bind=(id,set,suffix='px')=>$(id)?.addEventListener('input',e=>{set(+e.target.value);e.target.nextElementSibling.textContent=e.target.value+suffix});bind('#pencilSize',v=>pencilSize=v);bind('#brushSize',v=>brushSize=v);bind('#brushSoftness',v=>brushSoftness=v/100,'%');bind('#brushAngle',v=>brushAngle=v,'°');bind('#markerSize',v=>markerSize=v);bind('#markerOpacity',v=>markerOpacity=v/100,'%');bind('#markerAngle',v=>markerAngle=v,'°');bind('#penSize',v=>penSize=v);bind('#penContrast',v=>penContrast=v/100,'%');bind('#penAngle',v=>penAngle=v,'°');bind('#emojiSize',v=>emojiSize=v);$('#pressureToggle')?.addEventListener('click',()=>{pressureEnabled=!pressureEnabled;renderOptions()});$$('[data-brushpreset]').forEach(b=>b.onclick=()=>{brushPreset=b.dataset.brushpreset;renderOptions()});$$('[data-markerpreset]').forEach(b=>b.onclick=()=>{markerPreset=b.dataset.markerpreset;if(markerPreset==='highlighter')markerOpacity=.25;renderOptions()});$$('[data-penpreset]').forEach(b=>b.onclick=()=>{penPreset=b.dataset.penpreset;renderOptions()});$$('[data-emoji]').forEach(b=>b.onclick=()=>{emoji=b.dataset.emoji;renderOptions()})}'''
          s, n = re.subn(r"function renderOptions\(\)\{.*?\}\n\$\('#customColorBtn'\)", options + "\n$('#customColorBtn')", s, count=1, flags=re.S)
          if n != 1:
            raise SystemExit('options block not found')

          s = s.replace('.seg{display:flex;gap:5px;flex:1}', '.seg{display:flex;gap:5px;flex:1;flex-wrap:wrap}.presetWrap button{flex:0 0 auto}.penPresets{max-height:78px;overflow:auto;padding-right:30px}')

          p.write_text(s)
      - name: Validate module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          Path('/tmp/module.mjs').write_text(m.group(1))
          PY
          node --check /tmp/module.mjs
      - name: Commit upgrade
        run: |
          rm .github/workflows/brush-engine-v2.yml
          git config user.name "glued-canvas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Differentiate brush marker and pen engines"
          git push
